<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="data:application/json,{%22name%22:%22Half Marathon Tracker%22,%22short_name%22:%22Training%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23000000%22,%22theme_color%22:%22%23000000%22}">
<title>Half Marathon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--s1:#0d0d0d;--s2:#161616;--s3:#1e1e1e;--s4:#272727;
  --b1:#1e1e1e;--b2:#2a2a2a;--b3:#363636;
  --t1:#f0f0f0;--t2:#909090;--t3:#505050;
  --green:#1db954;--green-bg:#061410;--green-dim:#0a2a18;
  --blue:#4a9eff;--blue-bg:#050f1f;--blue-dim:#0a1f3a;
  --amber:#f0a500;--amber-bg:#1a1000;--amber-dim:#2a1a00;
  --purple:#9b7ff4;--purple-bg:#0d0a1e;--purple-dim:#1e1040;
  --red:#e05050;
  --r:14px;--rsm:10px;--rlg:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px}
body{min-height:100vh;background:var(--bg);overflow-x:hidden}

/* screens */
.screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:calc(62px + var(--safe-b))}
.screen.active{display:flex}

/* topbar */
.topbar{padding:16px 18px 12px;background:var(--bg);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:20}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.topbar-title{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.topbar-sub{font-size:14px;color:var(--t2)}
.pills{display:flex;gap:6px}
.pill{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.pill-g{background:var(--green-dim);color:var(--green)}
.pill-p{background:var(--purple-dim);color:var(--purple)}
.prog-bar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:2px}
.prog-fill{height:3px;background:var(--green);border-radius:2px;transition:width .5s}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--t3);margin-top:6px}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--s1);border-top:1px solid var(--b1);display:flex;padding-bottom:var(--safe-b)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;cursor:pointer;gap:3px}
.ni:active{opacity:.6}
.ni-icon{font-size:20px;line-height:1}
.ni-label{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--t3);transition:color .15s}
.ni.active .ni-label{color:var(--green)}

/* phase strip */
.phase-strip{display:flex;gap:6px;padding:14px 18px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.phase-strip::-webkit-scrollbar{display:none}
.pchip{padding:7px 15px;border-radius:99px;border:1px solid var(--b2);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;background:var(--s2);color:var(--t2);flex-shrink:0;transition:all .15s}
.pchip.active{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}

/* week sections */
.week-section{padding:18px 18px 6px}
.week-label{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.05em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.week-prog{font-size:13px;color:var(--t3);font-weight:400}
.day-list{display:flex;flex-direction:column;gap:7px;padding:0 18px}

/* day rows */
.day-row{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .15s;min-height:68px}
.day-row:active{transform:scale(.98);background:var(--s2)}
.day-row.done{border-color:var(--green-dim);background:var(--green-bg)}
.day-row.rest{background:var(--bg);border-color:var(--b1)}
.day-row.yoga-m{border-left:3px solid var(--purple)}
.dr-day{display:flex;flex-direction:column;align-items:center;min-width:38px;gap:3px}
.dr-dayname{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.04em}
.dr-icon{font-size:22px;line-height:1}
.dr-mid{flex:1;min-width:0}
.dr-title{font-size:16px;font-weight:600;color:var(--t1);line-height:1.2}
.dr-meta{font-size:13px;color:var(--t2);margin-top:3px;line-height:1.3}
.dr-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.dr-check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--b3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--bg)}
.day-row.done .dr-check{background:var(--green);border-color:var(--green)}
.ydot{width:8px;height:8px;border-radius:50%;background:var(--purple)}
/* swap mode */
.week-edit-btn{font-size:12px;font-weight:600;color:var(--t3);background:none;border:1px solid var(--b2);border-radius:99px;padding:4px 10px;cursor:pointer;transition:all .15s;flex-shrink:0}
.week-edit-btn.editing{color:var(--green);border-color:var(--green-dim);background:var(--green-dim)}
.swap-hint{font-size:13px;color:var(--t2);padding:6px 18px 4px;font-style:italic}
.day-row.swap-selectable{border-color:var(--b3)}
.day-row.swap-selected{border-color:var(--blue) !important;background:var(--blue-dim) !important}
.day-row.swap-selected .dr-title{color:var(--blue)}

/* detail screen */
.detail-header{padding:14px 18px 12px;background:var(--bg);border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;color:var(--t1);transition:all .15s}
.back-btn:active{transform:scale(.92)}
.dh-info{flex:1}
.dh-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.dh-sub{font-size:14px;color:var(--t2);margin-top:2px}
.detail-body{display:flex;flex-direction:column}

/* morning yoga block */
.morning-block{margin:14px 18px 8px;background:var(--purple-bg);border:1px solid #1e1540;border-radius:var(--r);overflow:hidden}
.mb-header{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.mb-left{display:flex;align-items:center;gap:12px}
.mb-icon{font-size:24px}
.mb-title{font-size:16px;font-weight:600;color:var(--purple)}
.mb-sub{font-size:13px;color:#5a4880;margin-top:2px}
.mb-badge{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--purple-dim);color:var(--purple)}
.mb-chev{font-size:15px;color:#5a4880}

/* flow picker */
.flow-picker-wrap{padding:0 14px 14px}
.flow-group-label{font-size:11px;font-weight:700;color:#5a4880;letter-spacing:.06em;margin:10px 0 6px}
.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.flow-card{background:#0a0618;border:1px solid #1e1540;border-radius:var(--rsm);padding:12px 14px;cursor:pointer;transition:all .15s}
.flow-card:active{transform:scale(.97)}
.flow-card.sel{background:var(--purple-dim);border-color:var(--purple)}
.fc-name{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:3px}
.fc-time{font-size:12px;color:var(--purple);font-weight:500}
.fc-desc{font-size:12px;color:#5a4880;margin-top:3px;line-height:1.35}

/* flow steps */
.flow-steps-wrap{padding:0 14px 14px}
.flow-steps-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.flow-steps-title{font-size:15px;font-weight:600;color:var(--purple)}
.change-btn{font-size:13px;color:#5a4880;background:none;border:none;cursor:pointer;padding:4px 0}

/* core circuit */
.circuit-block{margin:0 18px 8px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.cb-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cb-title{font-size:16px;font-weight:600;color:var(--amber)}
.cb-sub{font-size:13px;color:#5a3800;margin-top:2px}
.cb-chev{font-size:15px;color:var(--t3)}
.circuit-picker{display:flex;gap:7px;padding:0 14px 14px}
.cp-btn{flex:1;padding:10px;border-radius:var(--rsm);border:1px solid var(--b2);font-size:14px;font-weight:600;cursor:pointer;text-align:center;background:var(--s2);color:var(--t2);transition:all .15s}
.cp-btn.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.cp-btn:active{transform:scale(.97)}

/* workout block */
.workout-block{margin:0 18px 10px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.wb-sec{border-top:1px solid var(--b1)}
.wb-sec:first-child{border-top:none}
.wb-sec-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.07em;padding:14px 18px 8px}
.checklist{display:flex;flex-direction:column;gap:5px;padding:0 14px 12px}
.ci{display:flex;align-items:flex-start;gap:14px;padding:12px 14px;border-radius:var(--rsm);background:var(--s2);cursor:pointer;transition:background .12s;-webkit-user-select:none}
.ci:active{background:var(--s3)}
.ci.done{background:var(--green-bg)}
.ci-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--b3);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bg);background:var(--s3);transition:all .15s}
.ci.done .ci-box{background:var(--green);border-color:var(--green)}
.ci-text{font-size:15px;line-height:1.5;color:var(--t1)}
.ci.done .ci-text{color:var(--t3);text-decoration:line-through}

/* pace table inside workout */
.pace-table{margin:4px 0 8px;border-radius:var(--rsm);overflow:hidden;border:1px solid var(--b2)}
.pt-row{display:grid;grid-template-columns:1fr 60px 110px;gap:0;border-bottom:1px solid var(--b1)}
.pt-row:last-child{border-bottom:none}
.pt-row.header{background:var(--s3)}
.pt-cell{padding:9px 12px;font-size:13px;color:var(--t2);line-height:1.3}
.pt-row.header .pt-cell{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.05em}
.pt-cell.pace{color:var(--green);font-weight:600}
.pt-cell.effort{color:var(--amber);font-weight:600}

/* flex toggle */
.flex-toggle{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--b1)}
.ft-btn{flex:1;padding:12px;border-radius:var(--rsm);border:1px solid var(--b2);font-size:15px;font-weight:600;cursor:pointer;text-align:center;background:var(--s2);color:var(--t2);transition:all .15s}
.ft-btn:active{transform:scale(.97)}
.ft-btn.hike{background:var(--amber-bg);border-color:#3a2800;color:var(--amber)}
.ft-btn.cycle{background:var(--blue-bg);border-color:#0d2040;color:var(--blue)}
.flex-hint{padding:28px;text-align:center;font-size:15px;color:var(--t3)}

/* mark done */
.mark-block{margin:0 18px 10px}
.mark-btn{width:100%;padding:16px;border-radius:var(--r);border:1px solid var(--b2);font-size:16px;font-weight:700;cursor:pointer;background:var(--s2);color:var(--t1);transition:all .15s;letter-spacing:-.2px}
.mark-btn:active{transform:scale(.98)}
.mark-btn.done{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}
.mark-btn.hike-done{background:var(--amber-bg);color:var(--amber);border-color:#3a2800}
.mark-btn.cycle-done{background:var(--blue-bg);color:var(--blue);border-color:#0d2040}

/* note */
.note-block{margin:0 18px 28px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:16px 18px}
.note-label{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.06em;margin-bottom:8px}
textarea{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rsm);color:var(--t1);font-size:15px;font-family:inherit;line-height:1.55;padding:12px 14px;resize:none;min-height:76px}
textarea:focus{outline:none;border-color:var(--b3)}
textarea::placeholder{color:var(--t3)}

/* tags */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;padding:4px 18px 14px}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}
.tag-e{background:var(--green-dim);color:var(--green)}
.tag-s{background:var(--blue-dim);color:var(--blue)}
.tag-st{background:#1f0e00;color:#e07830}
.tag-r{background:var(--s3);color:var(--t2)}
.tag-p{background:var(--purple-dim);color:var(--purple)}
.tag-h{background:var(--amber-bg);color:var(--amber)}

/* ── RUNS TAB ── */
.runs-screen{display:flex;flex-direction:column}
.pace-ref{margin:14px 18px 0;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.pr-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pr-title{font-size:16px;font-weight:600;color:var(--blue)}
.pr-chev{font-size:15px;color:var(--t3)}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--b1);margin-bottom:0}
.pr-cell{background:var(--s1);padding:10px 14px}
.pr-type{font-size:13px;color:var(--t2)}
.pr-pace{font-size:14px;font-weight:600;color:var(--green);margin-top:2px}

.run-phase-strip{display:flex;gap:6px;padding:14px 18px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.run-phase-strip::-webkit-scrollbar{display:none}

.run-week-label{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.05em;padding:14px 18px 8px;display:flex;justify-content:space-between}
.run-week-mi{font-size:13px;color:var(--t3);font-weight:400}
.run-list{display:flex;flex-direction:column;gap:7px;padding:0 18px}

.run-row{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .15s}
.run-row:active{transform:scale(.98)}
.run-row.done{border-color:var(--green-dim);background:var(--green-bg)}
.rr-intensity{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch}
.rr-intensity.easy{background:var(--green)}
.rr-intensity.mod{background:var(--amber)}
.rr-intensity.hard{background:var(--red)}
.rr-mid{flex:1;min-width:0}
.rr-title{font-size:16px;font-weight:600;color:var(--t1)}
.rr-meta{font-size:13px;color:var(--t2);margin-top:3px;line-height:1.35}
.rr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.rr-dist{font-size:14px;font-weight:600;color:var(--t2)}
.rr-check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--b3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bg)}
.run-row.done .rr-check{background:var(--green);border-color:var(--green)}

/* run detail */
.run-detail-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.rdb-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.rdb-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.07em;padding:14px 18px 8px}
.effort-note{font-size:14px;color:var(--t2);padding:0 18px 14px;line-height:1.5}

/* ── PROGRESS TAB ── */
.progress-screen{padding:18px}
.ps-title{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.ps-sub{font-size:15px;color:var(--t2);margin-bottom:20px}
.big-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big-stat{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:18px}
.bs-n{font-size:38px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.bs-l{font-size:14px;color:var(--t2);margin-top:5px}
.big-stat.g .bs-n{color:var(--green)}
.big-stat.p .bs-n{color:var(--purple)}
.big-stat.a .bs-n{color:var(--amber)}
.big-stat.b .bs-n{color:var(--blue)}
.ps-section{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.05em;margin:18px 0 10px}

/* mileage section */
.mileage-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.mi-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b1)}
.mi-row:last-child{border-bottom:none}
.mi-label{font-size:15px;color:var(--t1)}
.mi-val{font-size:15px;font-weight:600;color:var(--green)}
.mi-sub{font-size:13px;color:var(--t3);margin-top:2px}

.phase-cards{display:flex;flex-direction:column;gap:8px}
.phase-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pc-name{font-size:15px;font-weight:600}
.pc-pct{font-size:14px;color:var(--green);font-weight:600}
.pc-bar{height:3px;background:var(--s3);border-radius:2px}
.pc-fill{height:3px;background:var(--green);border-radius:2px}
.pc-meta{font-size:13px;color:var(--t3);margin-top:6px}

/* ── FLOWS TAB ── */
.flows-screen{padding:18px}
.fs-title{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.fs-sub{font-size:15px;color:var(--t2);margin-bottom:20px}
.fs-group{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.05em;margin:18px 0 10px}
.fs-group:first-of-type{margin-top:0}
.flow-big-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.fbc-header{padding:16px 18px;display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer}
.fbc-hdr-left .fbc-name{font-size:16px;font-weight:700}
.fbc-hdr-left .fbc-time{font-size:13px;color:var(--purple);margin-top:3px;font-weight:500}
.fbc-hdr-left .fbc-desc{font-size:14px;color:var(--t2);margin-top:3px}
.fbc-arrow{font-size:16px;color:var(--t3);margin-left:10px;flex-shrink:0;margin-top:2px}
.fbc-poses{padding:0 14px 14px;display:flex;flex-direction:column;gap:5px}
.fbc-pose{padding:11px 14px;border-radius:var(--rsm);background:var(--s2);font-size:14px;color:var(--t2);line-height:1.45}
</style>
</head>
<body>

<!-- SCHEDULE -->
<div class="screen active" id="screen-schedule">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <div class="topbar-title">Training</div>
        <div class="topbar-sub" id="phase-label-main">Phase 1 · Base</div>
      </div>
      <div class="pills" id="streak-pills"></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="main-prog" style="width:0%"></div></div>
    <div class="prog-meta"><span id="prog-done-label"></span><span id="prog-pct-label"></span></div>
  </div>
  <div class="phase-strip" id="phase-chips"></div>
  <div id="week-list" style="padding-bottom:12px"></div>
</div>

<!-- DETAIL -->
<div class="screen" id="screen-detail">
  <div class="detail-header">
    <div class="back-btn" id="back-btn">&#8592;</div>
    <div class="dh-info">
      <div class="dh-title" id="dh-title"></div>
      <div class="dh-sub" id="dh-sub"></div>
    </div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- WORKOUTS -->
<div class="screen" id="screen-runs">
  <div class="topbar" style="margin-bottom:0">
    <div class="topbar-row">
      <div class="topbar-title" id="workouts-title">Workouts</div>
    </div>
    <div style="display:flex;gap:0;margin-top:10px;background:var(--s2);border-radius:var(--r);padding:3px">

// Map week index to strength key
function getStrengthKey(wi){
  // Use actual scheduled day (respects swaps) to determine which block
  const days=getWeekDays(wi);
  const tk=days[2]; // Wednesday is always the strength slot
  const w=WEEKS[wi];
  // Map template key + week to detailed strength block
  if(tk==='strength-base'){
    if(w.p===0) return wi<=1?'s_0_0':'s_0_1';
    return 's_3_0'; // taper
  }
  if(tk==='strength-build'){
    if(wi<=5)return 's_1_0';
    if(wi<=7)return 's_1_1';
    return 's_1_2';
  }
  if(tk==='strength-maint'){
    return wi<=11?'s_2_0':'s_2_1';
  }
  // fallback
  if(w.p===0) return wi<=1?'s_0_0':'s_0_1';
  if(w.p===1){if(wi<=5)return 's_1_0';if(wi<=7)return 's_1_1';return 's_1_2';}
  if(w.p===2) return wi<=11?'s_2_0':'s_2_1';
  return 's_3_0';
}
// Get the actual strength template name from schedule for display
function getStrengthTemplateName(wi){
  const days=getWeekDays(wi);
  const tk=days[2];
  const names={'strength-base':'Strength','strength-build':'Strength','strength-maint':'Strength (maintenance)'};
  return names[tk]||'Strength';
}

// ── STORAGE ──────────────────────────────────────────────
function ld(){try{return JSON.parse(localStorage.getItem('hmt5')||'{}')}catch{return {}}}
function sv(s){try{localStorage.setItem('hmt5',JSON.stringify(s))}catch{}}
function get(k){return ld()[k]}
function set(k,v){const s=ld();s[k]=v;sv(s)}
function tog(k){const s=ld();s[k]=!s[k];sv(s);return s[k]}
function del(k){const s=ld();delete s[k];sv(s)}

const dk=(wi,di)=>`d_${wi}_${di}`;
const ck=(wi,di,sec,i)=>`c_${wi}_${di}_${sec}_${i}`;
const nk=(wi,di)=>`n_${wi}_${di}`;
const fk=wi=>`f_${wi}`;
const yk=(wi,di)=>`y_${wi}_${di}`;
const yfk=(wi,di)=>`yf_${wi}_${di}`;
const yck=(wi,di,i)=>`yc_${wi}_${di}_${i}`;
const cck=(wi,di)=>`cc_${wi}_${di}`;

// ── STATS ─────────────────────────────────────────────────
function totalDone(){const s=ld();return WEEKS.reduce((a,w,wi)=>a+getWeekDays(wi).filter((_,di)=>s[dk(wi,di)]).length,0)}
function totalRunsDone(){const s=ld();return WEEKS.reduce((a,w,wi)=>{const days=getWeekDays(wi);return a+w.runIdx.filter(di=>s[dk(wi,di)]).length;},0);}
function totalRunsPlanned(){return WEEKS.reduce((a,w)=>a+w.runIdx.length,0);}
function totalStrengthDone(){const s=ld();return WEEKS.reduce((a,w,wi)=>{const days=getWeekDays(wi);const hasSt=days[2]&&days[2].startsWith('strength');return a+(hasSt&&s[dk(wi,2)]?1:0);},0);}
function totalStrengthPlanned(){return WEEKS.length;}
function runStreak(){const s=ld();let c=0;outer:for(let wi=WEEKS.length-1;wi>=0;wi--){const days=getWeekDays(wi);for(let ri=WEEKS[wi].runIdx.length-1;ri>=0;ri--){const di=WEEKS[wi].runIdx[ri];if(s[dk(wi,di)])c++;else break outer;}}return c;}
function strengthStreak(){const s=ld();let c=0;for(let wi=WEEKS.length-1;wi>=0;wi--){if(s[dk(wi,2)])c++;else break;}return c;}
function totalWork(){return WEEKS.reduce((a,w)=>a+w.days.filter(d=>!['rest'].includes(d)).length,0)}
function yogaStreak(){const s=ld();let c=0;for(let wi=WEEKS.length-1;wi>=0;wi--)for(let di=6;di>=0;di--){if(s[yk(wi,di)])c++;else if(c>0)return c;}return c;}
function workStreak(){const s=ld();let c=0;outer:for(let wi=WEEKS.length-1;wi>=0;wi--)for(let di=6;di>=0;di--){const tk=getWeekDays(wi)[di];if(tk==='rest'||tk==='yoga'||tk==='yoga-build')continue;if(s[dk(wi,di)])c++;else break outer;}return c;}
function milesLogged(){return WEEKS.reduce((a,w,wi)=>{return a+w.runIdx.filter(di=>get(dk(wi,di))).reduce((b,di)=>{const rw=RUN_WORKOUTS[w.days[di]];if(!rw)return b;const d=rw.dist;const m=d.match(/(\d+)/);return b+(m?parseInt(m[1]):0);},0);},0);}
function totalPlanMiles(){return WEEKS.reduce((a,w)=>a+w.mi,0);}

let curPhase=0,curWeek=null,curDay=null,showYoga=false,curRunWi=null,curRunDi=null;

let swapEditWeek=null,swapFirstDay=null;
// per-week day overrides: swapOverrides[wi] = [...days]
function getWeekDays(wi){return get('swap_'+wi)||WEEKS[wi].days;}
function saveWeekDays(wi,days){set('swap_'+wi,days);}

function showScreen(id,el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));

  if(id==='flows')renderFlowsTab();

// ── SCHEDULE ─────────────────────────────────────────────
function renderSchedule(){
  const done=totalDone(),total=totalWork(),pct=Math.round(done/total*100);
  const ws=workStreak(),ys=yogaStreak();
  document.getElementById('phase-label-main').textContent=`${PHASES[curPhase].l} · ${PHASES[curPhase].s}`;
  document.getElementById('main-prog').style.width=pct+'%';
  document.getElementById('prog-done-label').textContent=`${done} of ${total} workouts`;
  document.getElementById('prog-pct-label').textContent=pct+'%';
  let pills='';
  if(ws>0)pills+=`<span class="pill pill-g">🔥 ${ws}</span>`;
  if(ys>0)pills+=`<span class="pill pill-p">🧘 ${ys}</span>`;
  document.getElementById('streak-pills').innerHTML=pills;
  document.getElementById('phase-chips').innerHTML=PHASES.map(p=>`<button class="pchip${p.id===curPhase?' active':''}" onclick="setPhase(${p.id})">${p.l}: ${p.s}</button>`).join('');

  const weeks=WEEKS.filter(w=>w.p===curPhase);
  let h='';
  weeks.forEach(week=>{
    const wi=WEEKS.indexOf(week);
    const days=getWeekDays(wi);
    const workDays=days.filter(d=>d!=='rest');
    const doneDays=days.filter((d,di)=>d!=='rest'&&get(dk(wi,di)));
    const wpct=workDays.length?Math.round(doneDays.length/workDays.length*100):0;
    const isEditing=swapEditWeek===wi;
    h+=`<div class="week-section"><div class="week-label"><span>Week ${week.n}</span><div style="display:flex;align-items:center;gap:8px"><span class="week-prog">${doneDays.length}/${workDays.length}</span><button class="week-edit-btn${isEditing?' editing':''}" onclick="event.stopPropagation();toggleSwapMode(${wi})">${isEditing?'Done':'Edit'}</button></div></div></div>`;
    if(isEditing)h+=`<div class="swap-hint">${swapFirstDay===null?'Tap a day to move it':'Now tap the day to swap it with'}</div>`;
    h+=`<div class="day-list">`;
    days.forEach((tk,di)=>{
      const isRun=!!RUN_WORKOUTS[tk];
      const t=isRun?RUN_WORKOUTS[tk]:T[tk];
      if(!t)return;
      const done=get(dk(wi,di));
      const yd=get(yk(wi,di));
      const isRest=tk==='rest';
      const isFlex=tk==='flex-sunday';
      const fc=isFlex?get(fk(wi)):null;
      const isStrength=tk&&tk.startsWith('strength');
      const strengthSub=isStrength?STRENGTH_WEEKS[getStrengthKey(wi)].sub:null;
      const meta=isRest?'Recovery':isFlex?(fc?`${fc==='hike'?'Hiking':'Cycling'} planned`:'Choose hike or cycle'):isStrength?strengthSub:(isRun?t.paceSummary:t.sub);
      const isSelected=isEditing&&swapFirstDay===di;
      const swapClass=isEditing?(isSelected?' swap-selected':' swap-selectable'):'';
      const clickFn=isEditing?`handleSwapTap(${wi},${di})`:`openDay(${wi},${di})`;
      h+=`<div class="day-row${done?' done':''}${isRest?' rest':''}${yd&&!done?' yoga-m':''}${swapClass}" onclick="${clickFn}">
        <div class="dr-day"><div class="dr-dayname">${DAYS[di]}</div><div class="dr-icon">${t.icon}</div></div>
        <div class="dr-mid"><div class="dr-title">${t.label}</div><div class="dr-meta">${meta}</div></div>
        <div class="dr-right"><div class="dr-check">${done?'✓':''}</div>${yd&&!isEditing?'<div class="ydot"></div>':''}</div>
      </div>`;
    });
    h+=`</div>`;
  });
  document.getElementById('week-list').innerHTML=h;
}


function toggleSwapMode(wi){
  if(swapEditWeek===wi){swapEditWeek=null;swapFirstDay=null;}
  else{swapEditWeek=wi;swapFirstDay=null;}
  renderSchedule();
}

function handleSwapTap(wi,di){
  if(swapFirstDay===null){
    swapFirstDay=di;
    renderSchedule();
  } else if(swapFirstDay===di){
    swapFirstDay=null;
    renderSchedule();
  } else {
    const days=[...getWeekDays(wi)];
    const tmp=days[swapFirstDay];
    days[swapFirstDay]=days[di];
    days[di]=tmp;
    saveWeekDays(wi,days);
    swapFirstDay=null;
    renderSchedule();
  }
}

function setPhase(p){curPhase=p;renderSchedule();}

  const tk=getWeekDays(wi)[di];

  if(tk&&tk.startsWith('strength')){
    openStrengthDetailFromSchedule(wi);
    return;
  }
  curWeek=wi;curDay=di;
  const isRun=!!RUN_WORKOUTS[tk];
  const t=isRun?RUN_WORKOUTS[tk]:T[tk];
  if(!t)return;
  showYoga=!get(yk(wi,di));
  document.getElementById('dh-title').textContent=`${t.label} — ${DAYS[di]}`;
  document.getElementById('dh-sub').textContent=`Week ${WEEKS[wi].n} · ${isRun?t.paceSummary:t.sub}`;

  document.getElementById('screen-detail').classList.add('active');

}

function wbSection(label,items,prefix){

}

      sb.style.cssText='flex:1;padding:8px;border-radius:var(--rsm);border:none;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--t3);transition:all .15s';

      rb.style.cssText='flex:1;padding:8px;border-radius:var(--rsm);border:none;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--t3);transition:all .15s';
      sb.style.cssText='flex:1;padding:8px;border-radius:var(--rsm);border:none;font-size:14px;font-weight:600;cursor:pointer;background:var(--amber-dim);color:var(--amber);transition:all .15s';
    }
  }
  if(tab==='runs')renderRuns();
  else renderStrength();
}

function renderStrength(){
  const refOpen=get('sref_open');
  let h=`<div class="pace-ref" style="border-color:var(--amber-dim)">
    <div class="pr-header" onclick="togStrengthRef()" style="color:var(--amber)">
      <div class="pr-title" style="color:var(--amber)">Reference</div>
      <div class="pr-chev">${refOpen?'▲':'▼'}</div>
    </div>`;
  if(refOpen){
    h+=`<div style="display:flex;flex-direction:column;gap:1px;background:var(--b1)">`;
    STRENGTH_REF.forEach(r=>{
      h+=`<div style="background:var(--s1);padding:10px 16px"><div style="font-size:13px;color:var(--t2)">${r.type}</div><div style="font-size:13px;color:var(--t1);margin-top:3px;line-height:1.45">${r.note}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  // phase filter
  h+=`<div class="run-phase-strip">`;
  PHASES.forEach(p=>{
    h+=`<button class="pchip${p.id===runPhaseFilter?' active':''}" onclick="setRunPhase(${p.id})">${p.l}</button>`;
  });
  h+=`</div>`;

  const weeks=WEEKS.filter(w=>w.p===runPhaseFilter);
  weeks.forEach(week=>{
    const wi=WEEKS.indexOf(week);
    const sk=getStrengthKey(wi);
    const sw=STRENGTH_WEEKS[sk];
    const done=get(dk(wi,2));
    const scheduleDays=getWeekDays(wi);
    const schedTk=scheduleDays[2];
    const schedT=T[schedTk];
    const schedSub=schedT?schedT.sub:sw.sub;
    h+=`<div class="run-week-label"><span>Week ${week.n}</span><span class="run-week-mi">${sw.label}</span></div>`;
    h+=`<div class="run-list">`;
    h+=`<div class="run-row${done?' done':''}" onclick="openStrengthDetail(${wi})">
      <div class="rr-intensity ${sw.intensity}"></div>
      <div class="rr-mid">
        <div class="rr-title">${getStrengthTemplateName(wi)}</div>
        <div class="rr-meta">${sw.sub}</div>
      </div>
      <div class="rr-right">
        <div class="rr-dist" style="font-size:13px;color:var(--t3)">${sw.label}</div>
        <div class="rr-check">${done?'✓':''}</div>
      </div>
    </div>`;
    h+=`</div>`;
  });

  document.getElementById('runs-body').innerHTML=h;
}

function togStrengthRef(){set('sref_open',!get('sref_open'));renderStrength();}

function openStrengthDetail(wi){
  const sk=getStrengthKey(wi);
  const sw=STRENGTH_WEEKS[sk];
  const done=get(dk(wi,2));
  const note=get('sn_'+wi)||'';

  const sck=k=>get('sc_'+wi+'_'+k);
  const ciS=(k,text)=>{
    const chk=sck(k);
    return `<div class="ci${chk?' done':''}" onclick="togSItem('${wi}','${k}',this)">
      <div class="ci-box">${chk?'✓':''}</div>
      <div class="ci-text">${text}</div>
    </div>`;
  };

  let h=`<div class="run-detail-body">`;

  // reference card
  h+=`<div class="rdb-card" style="border-color:var(--amber-dim)">
    <div class="rdb-label" style="color:var(--amber)">SESSION OVERVIEW</div>
    <div class="effort-note">${sw.label} · ${sw.sub}<br>Structure: Opener → Push → Pull → Stability → Finisher</div>
  </div>`;

  // opener
  h+=`<div class="rdb-card"><div class="rdb-label">OPENER</div><div class="checklist">`;
  sw.opener.forEach((item,i)=>{h+=ciS(`op_${i}`,item)});
  h+=`</div></div>`;

  // push
  h+=`<div class="rdb-card"><div class="rdb-label">PUSH — chest · shoulders · triceps</div><div class="checklist">`;
  sw.push.forEach((item,i)=>{h+=ciS(`pu_${i}`,item)});
  h+=`</div></div>`;

  // pull
  h+=`<div class="rdb-card"><div class="rdb-label">PULL — back · biceps</div><div class="checklist">`;
  sw.pull.forEach((item,i)=>{h+=ciS(`pl_${i}`,item)});
  h+=`</div></div>`;

  // stability
  h+=`<div class="rdb-card"><div class="rdb-label">STABILITY — ankles · single-leg</div><div class="checklist">`;
  sw.stability.forEach((item,i)=>{h+=ciS(`st_${i}`,item)});
  h+=`</div></div>`;

  // finisher
  h+=`<div class="rdb-card"><div class="rdb-label">FINISHER</div><div class="checklist">`;
  sw.finisher.forEach((item,i)=>{h+=ciS(`fi_${i}`,item)});
  h+=`</div></div>`;

  // mark done
  h+=`<button class="mark-btn${done?' done':''}" style="${done?'background:var(--amber-dim);color:var(--amber);border-color:var(--amber-dim)':''}" onclick="markStrengthDone(${wi})">${done?'✓ Done':'Mark done'}</button>`;

  // note
  h+=`<div class="note-block" style="margin:10px 0 0"><div class="note-label">NOTES</div>
    <textarea placeholder="Weights used, how it felt, anything to adjust next time..." oninput="saveStrengthNote(${wi},this.value)">${note}</textarea>
  </div></div>`;

  document.getElementById('dh-title').textContent=`${getStrengthTemplateName(wi)} — Wk ${WEEKS[wi].n}`;
  document.getElementById('dh-sub').textContent=`${sw.label} · ${sw.sub}`;
  document.getElementById('detail-body').innerHTML=h;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-detail').classList.add('active');
  window.scrollTo(0,0);

  document.getElementById('back-btn').onclick=()=>{
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-runs').classList.add('active');
    document.querySelectorAll('.ni')[1].classList.add('active');
    renderStrength();window.scrollTo(0,0);
    rebindBackBtn();
  };
}

function openStrengthDetailFromSchedule(wi){
  openStrengthDetail(wi);
  document.getElementById('back-btn').onclick=()=>{
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-schedule').classList.add('active');
    document.querySelectorAll('.ni')[0].classList.add('active');
    renderSchedule();window.scrollTo(0,0);
    rebindBackBtn();
  };
}

function togSItem(wi,k,el){
  const sk='sc_'+wi+'_'+k;
  const now=tog(sk);
  el.classList.toggle('done',now);
  el.querySelector('.ci-box').innerHTML=now?'✓':'';
  el.querySelector('.ci-text').style.cssText=now?'text-decoration:line-through;color:var(--t3)':'color:var(--t1)';
}
function markStrengthDone(wi){tog(dk(wi,2));openStrengthDetail(wi);renderStrength();renderSchedule();}
function saveStrengthNote(wi,v){set('sn_'+wi,v);}

function renderRuns(){
  let h=``;
  // pace ref card
  h+=`<div class="pace-ref">
    <div class="pr-header" onclick="togglePaceRef()">
      <div class="pr-title">Pace reference</div>
      <div class="pr-chev">${paceRefOpen?'▲':'▼'}</div>
    </div>`;
  if(paceRefOpen){
    h+=`<div class="pr-grid">`;
    PACE_REF.forEach(r=>{
      h+=`<div class="pr-cell"><div class="pr-type">${r.type}</div><div class="pr-pace">${r.pace}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  // phase filter
  h+=`<div class="run-phase-strip">`;
  PHASES.forEach(p=>{
    h+=`<button class="pchip${p.id===runPhaseFilter?' active':''}" onclick="setRunPhase(${p.id})">${p.l}</button>`;
  });
  h+=`</div>`;

  // weeks
  const weeks=WEEKS.filter(w=>w.p===runPhaseFilter);
  weeks.forEach(week=>{
    const wi=WEEKS.indexOf(week);
    const days=getWeekDays(wi);const runsThisWeek=week.runIdx.map(di=>({di,tk:days[di]}));
    const doneCount=runsThisWeek.filter(r=>get(dk(wi,r.di))).length;
    h+=`<div class="run-week-label"><span>Week ${week.n}</span><span class="run-week-mi">${doneCount}/${runsThisWeek.length} runs · ~${week.mi} mi planned</span></div>`;
    h+=`<div class="run-list">`;
    runsThisWeek.forEach(({di,tk})=>{
      const rw=RUN_WORKOUTS[tk];if(!rw)return;
      const done=get(dk(wi,di));
      const intCls=rw.intensity;
      h+=`<div class="run-row${done?' done':''}" onclick="openRunDetail(${wi},${di})">
        <div class="rr-intensity ${intCls}"></div>
        <div class="rr-mid">
          <div class="rr-title">${rw.label}</div>
          <div class="rr-meta">${DAYS[di]} · ${rw.paceSummary}</div>
        </div>
        <div class="rr-right">
          <div class="rr-dist">${rw.dist}</div>
          <div class="rr-check">${done?'✓':''}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  });

  document.getElementById('runs-body').innerHTML=h;
}

function togglePaceRef(){paceRefOpen=!paceRefOpen;renderRuns()}
function setRunPhase(p){runPhaseFilter=p;if(workoutTab==='strength')renderStrength();else renderRuns();}

function openRunDetail(wi,di){
  curRunWi=wi;curRunDi=di;
  const tk=WEEKS[wi].days[di];
  const rw=RUN_WORKOUTS[tk];
  const done=get(dk(wi,di));
  const note=get(nk(wi,di))||'';

  let h=`<div class="run-detail-body">`;

  // pace table
  h+=`<div class="rdb-card"><div class="rdb-label">PACE BREAKDOWN</div>
  <div style="padding:0 14px 14px"><div class="pace-table">
    <div class="pt-row header"><div class="pt-cell">Segment</div><div class="pt-cell">Dist</div><div class="pt-cell">Pace / effort</div></div>`;
  rw.segments.forEach(seg=>{
    const cls=seg.type==='effort'?' effort':seg.type==='note'?'':' pace';
    h+=`<div class="pt-row"><div class="pt-cell">${seg.seg}</div><div class="pt-cell">${seg.dist}</div><div class="pt-cell${cls}">${seg.pace}</div></div>`;
  });
  h+=`</div></div></div>`;

  // notes
  h+=`<div class="rdb-card"><div class="rdb-label">COACHING NOTE</div><div class="effort-note">${rw.notes}</div></div>`;

  // cool-down & stretch
  if(rw.cd){
    h+=`<div class="rdb-card"><div class="rdb-label">COOL-DOWN</div><div class="checklist">`;
    CD_RUN.forEach((item,i)=>{const k=ck(wi,di,'rcd',i);h+=ci(k,item,get(k),'togRunItem');});
    h+=`</div></div>`;
  }
  if(rw.str){
    h+=`<div class="rdb-card"><div class="rdb-label">STRETCHING</div><div class="checklist">`;
    STRETCH.forEach((item,i)=>{const k=ck(wi,di,'rstr',i);h+=ci(k,item,get(k),'togRunItem');});
    h+=`</div></div>`;
  }

  // mark done
  h+=`<button class="mark-btn${done?' done':''}" onclick="markRunDone(${wi},${di})">${done?'✓ Logged':'Mark done'}</button>`;

  // note
  h+=`<div class="note-block" style="margin:10px 0 0"><div class="note-label">NOTES</div>
    <textarea placeholder="Actual pace, conditions, how you felt..." oninput="saveRunNote(${wi},${di},this.value)">${note}</textarea>
  </div>`;

  h+=`</div>`;

  document.getElementById('dh-title').textContent=`${rw.label} — Wk ${WEEKS[wi].n}`;
  document.getElementById('dh-sub').textContent=`${DAYS[di]} · ${rw.dist}`;
  document.getElementById('detail-body').innerHTML=h;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-detail').classList.add('active');
  window.scrollTo(0,0);

  // back goes to runs tab
  document.getElementById('back-btn').onclick=()=>{
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-runs').classList.add('active');
    document.querySelectorAll('.ni')[1].classList.add('active');
    renderRuns();window.scrollTo(0,0);
    rebindBackBtn();
  };
}

function rebindBackBtn(){
  document.getElementById('back-btn').onclick=()=>{
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-schedule').classList.add('active');
    document.querySelectorAll('.ni')[0].classList.add('active');
    renderSchedule();window.scrollTo(0,0);
    rebindBackBtn();
  };
}

function togRunItem(k,el){togItem(k,el)}
function markRunDone(wi,di){tog(dk(wi,di));openRunDetail(wi,di);renderRuns()}
function saveRunNote(wi,di,v){set(nk(wi,di),v)}

// ── PROGRESS ─────────────────────────────────────────────
function renderProgress(){
  const done=totalDone(),total=totalWork(),pct=Math.round(done/total*100);
  const ws=workStreak(),ys=yogaStreak(),rs=runStreak(),ss=strengthStreak();
  const miLogged=milesLogged(),miTotal=totalPlanMiles();
  const rdone=totalRunsDone(),rtotal=totalRunsPlanned();
  const sdone=totalStrengthDone(),stotal=totalStrengthPlanned();

  let h=`<div class="ps-title">Progress</div>
  <div class="ps-sub">Half marathon · 16 weeks</div>
  <div class="big-grid">
    <div class="big-stat g"><div class="bs-n">${done}</div><div class="bs-l">Workouts done</div></div>
    <div class="big-stat"><div class="bs-n">${pct}%</div><div class="bs-l">Plan complete</div></div>
    <div class="big-stat a"><div class="bs-n">${ws}</div><div class="bs-l">Active streak</div></div>
    <div class="big-stat p"><div class="bs-n">${ys}</div><div class="bs-l">Yoga streak</div></div>
  </div>`;

  // streaks row
  h+=`<div class="ps-section">STREAKS</div>
  <div class="mileage-card">
    <div class="mi-row"><div><div class="mi-label">🔥 Active streak</div><div class="mi-sub">Consecutive workouts logged</div></div><div class="mi-val">${ws}</div></div>
    <div class="mi-row"><div><div class="mi-label">🏃 Run streak</div><div class="mi-sub">Consecutive runs logged</div></div><div class="mi-val">${rs}</div></div>
    <div class="mi-row"><div><div class="mi-label">💪 Strength streak</div><div class="mi-sub">Consecutive strength sessions</div></div><div class="mi-val">${ss}</div></div>
    <div class="mi-row"><div><div class="mi-label">🧘 Yoga streak</div><div class="mi-sub">Consecutive morning yoga days</div></div><div class="mi-val">${ys}</div></div>
  </div>`;

  // runs vs strength breakdown
  h+=`<div class="ps-section">WORKOUTS</div>
  <div class="mileage-card">
    <div class="mi-row"><div><div class="mi-label">Runs completed</div><div class="mi-sub">${rdone} of ${rtotal} planned runs</div></div><div class="mi-val">${rtotal?Math.round(rdone/rtotal*100):0}%</div></div>
    <div class="mi-row"><div><div class="mi-label">Strength sessions</div><div class="mi-sub">${sdone} of ${stotal} planned sessions</div></div><div class="mi-val">${stotal?Math.round(sdone/stotal*100):0}%</div></div>
  </div>`;

  // mileage
  h+=`<div class="ps-section">MILEAGE</div>
  <div class="mileage-card">
    <div class="mi-row"><div><div class="mi-label">Miles logged</div><div class="mi-sub">Runs completed so far</div></div><div class="mi-val">${miLogged} mi</div></div>
    <div class="mi-row"><div><div class="mi-label">Plan total</div><div class="mi-sub">All 16 weeks combined</div></div><div class="mi-val">${miTotal} mi</div></div>
    <div class="mi-row"><div><div class="mi-label">Miles remaining</div><div class="mi-sub">Planned but not yet run</div></div><div class="mi-val">${Math.max(0,miTotal-miLogged)} mi</div></div>
  </div>`;

  // by phase
  h+=`<div class="ps-section">BY PHASE</div><div class="phase-cards">`;
  PHASES.forEach(ph=>{
    const phWeeks=WEEKS.filter(w=>w.p===ph.id);
    const phTotal=phWeeks.reduce((a,w)=>a+w.days.filter(d=>d!=='rest').length,0);
    const phDone=phWeeks.reduce((a,w,lwi)=>{const wi=WEEKS.indexOf(w);return a+getWeekDays(wi).filter((d,di)=>d!=='rest'&&get(dk(wi,di))).length},0);
    const phRuns=phWeeks.reduce((a,w,lwi)=>{const wi=WEEKS.indexOf(w);return a+w.runIdx.filter(di=>get(dk(wi,di))).length},0);
    const phStr=phWeeks.reduce((a,w,lwi)=>{const wi=WEEKS.indexOf(w);return a+(get(dk(wi,2))?1:0)},0);
    const phMi=phWeeks.reduce((a,w)=>a+w.mi,0);
    const pp=phTotal?Math.round(phDone/phTotal*100):0;
    h+=`<div class="phase-card">
      <div class="pc-top"><span class="pc-name">${ph.l}: ${ph.s}</span><span class="pc-pct">${phDone}/${phTotal}</span></div>
      <div class="pc-bar"><div class="pc-fill" style="width:${pp}%"></div></div>
      <div class="pc-meta">${phRuns} runs · ${phStr} strength · ~${phMi} mi planned</div>
    </div>`;
  });
  h+=`</div>`;

  document.getElementById('progress-body').innerHTML=h;
}

// ── FLOWS TAB ────────────────────────────────────────────
function renderFlowsTab(){
  let h=`<div class="fs-title">Morning flows</div>
  <div class="fs-sub">Rotate through these daily. Pick what fits the morning.</div>
  <div class="fs-group">WEEKDAY — 8–15 MIN</div>`;

  [...FLOWS_WD].forEach(f=>{
    const open=flowsExpanded[f.id];
    h+=`<div class="flow-big-card">
      <div class="fbc-header" onclick="toggleFlowCard('${f.id}')">
        <div class="fbc-hdr-left">
          <div class="fbc-name">${f.name}</div>
          <div class="fbc-time">${f.time}</div>
          <div class="fbc-desc">${f.desc}</div>
        </div>
        <div class="fbc-arrow">${open?'▲':'▼'}</div>
      </div>`;
    if(open){
      h+=`<div class="fbc-poses">`;
      f.poses.forEach(p=>{h+=`<div class="fbc-pose">${p}</div>`});
      h+=`</div>`;
    }
    h+=`</div>`;
  });

  h+=`<div class="fs-group">WEEKEND — 15–18 MIN</div>`;
  [...FLOWS_WE].forEach(f=>{
    const open=flowsExpanded[f.id];
    h+=`<div class="flow-big-card">
      <div class="fbc-header" onclick="toggleFlowCard('${f.id}')">
        <div class="fbc-hdr-left">
          <div class="fbc-name">${f.name}</div>
          <div class="fbc-time">${f.time}</div>
          <div class="fbc-desc">${f.desc}</div>
        </div>
        <div class="fbc-arrow">${open?'▲':'▼'}</div>
      </div>`;
    if(open){
      h+=`<div class="fbc-poses">`;
      f.poses.forEach(p=>{h+=`<div class="fbc-pose">${p}</div>`});
      h+=`</div>`;
    }
    h+=`</div>`;
  });

  document.getElementById('flows-body').innerHTML=h;
}

function toggleFlowCard(id){flowsExpanded[id]=!flowsExpanded[id];renderFlowsTab()}

// ── INIT ─────────────────────────────────────────────────
rebindBackBtn();
renderSchedule();

if('serviceWorker' in navigator){
  const sw=`const C='hmt5-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.pathname]))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
